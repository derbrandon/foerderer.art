
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flappy Bird | Brandon Förderer</title>

    <!-- CSS-Datei laden -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">

        <!-- Punktestand -->
        <div id="score-board">
            Score: <span id="score">0</span>
        </div>

        <!-- Spielfeld -->
        <canvas id="gameCanvas" width="360" height="500"></canvas>

        <!-- Game Over -->
        <div id="game-over-text" class="hidden">
            Game Over
            <br>
            <span style="font-size: 16px;">
                Press Space to Restart
            </span>
        </div>

    </div>

    <!-- JavaScript-Datei laden -->
    <script src="script.js"></script>

    <!-- comment your best score! -->

</body>
</html>
